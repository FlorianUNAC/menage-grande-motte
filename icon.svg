<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b7f90"/><stop offset="1" stop-color="#0e4f5c"/>
    </linearGradient>
    <linearGradient id="pyr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbe3a6"/><stop offset=".5" stop-color="#f7f2ea"/><stop offset=".5" stop-color="#e9d9bd"/><stop offset="1" stop-color="#dcc7a3"/>
    </linearGradient>
    <clipPath id="c"><rect width="512" height="512"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- soleil -->
    <circle cx="368" cy="150" r="54" fill="#f4c95d"/>
    <circle cx="368" cy="150" r="78" fill="#f4c95d" opacity=".18"/>
    <!-- pyramide de La Grande Motte, en terrasses -->
    <path d="M118 360 L236 150 L354 360 Z" fill="url(#pyr)"/>
    <g stroke="#0e4f5c" stroke-opacity=".28" stroke-width="7" stroke-linecap="round">
      <line x1="206" y1="205" x2="266" y2="205"/>
      <line x1="185" y1="243" x2="287" y2="243"/>
      <line x1="163" y1="281" x2="309" y2="281"/>
      <line x1="141" y1="320" x2="331" y2="320"/>
    </g>
    <!-- mer -->
    <path d="M0 360 H512 V512 H0 Z" fill="#0b3f4a"/>
    <path d="M0 382 q32 -22 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
    <path d="M0 428 q32 -22 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0" fill="none" stroke="#7fc4cf" stroke-width="10" stroke-linecap="round" opacity=".8"/>
    <!-- étincelle « propre » -->
    <path d="M404 262 l9 25 25 9 -25 9 -9 25 -9 -25 -25 -9 25 -9z" fill="#fff"/>
    <path d="M440 222 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill="#fff" opacity=".85"/>
