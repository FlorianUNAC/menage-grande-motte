<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning ménage · Studio La Grande Motte</title>
<meta name="theme-color" content="#0e4f5c">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e4f5c'/%3E%3Cpath d='M14 42 L32 16 L50 42 Z' fill='%23f4c95d'/%3E%3Cpath d='M10 48 q6 -5 12 0 t12 0 t12 0 t12 0' stroke='%23fff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<style>
  :root{
    --sea:#0e4f5c; --sea-2:#13697a; --sand:#f7f2ea; --sun:#f4c95d; --coral:#e2725b;
    --ink:#1d2a2e; --muted:#6b7a7e; --line:#e6e0d6; --card:#fff; --ok:#2f8f6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--sand);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  header{background:var(--sea);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 64px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-38px;height:80px;background:var(--sand);border-radius:50% 50% 0 0/100% 100% 0 0}
  .brand{display:flex;align-items:center;gap:12px}
  .brand svg{flex:none}
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:13.5px;opacity:.8}
  main{max-width:560px;margin:-44px auto 0;padding:0 16px 40px;position:relative;z-index:1}
  .card{background:var(--card);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(14,79,92,.07);padding:18px}
  .hero .kicker{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sea-2)}
  .hero .when{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
  .hero .rel{font-size:30px;font-weight:800;line-height:1.1}
  .hero .date{font-size:17px;color:var(--muted);text-transform:capitalize}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:6px 11px;border-radius:999px;margin-top:12px}
  .pill.rush{background:#fde8e3;color:#b4432c}
  .pill.calm{background:#e2f3ec;color:var(--ok)}
  .pill.none{background:#eef1f2;color:var(--muted)}
  .hero .next{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:15px;color:var(--muted)}
  .hero .next b{color:var(--ink)}
  h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:28px 4px 10px;font-weight:700}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .day{flex:none;width:54px;text-align:center;border-radius:12px;background:var(--sand);padding:6px 0}
  .day .dw{font-size:11.5px;text-transform:uppercase;font-weight:700;color:var(--muted);letter-spacing:.04em}
  .day .dn{font-size:22px;font-weight:800;line-height:1.05}
  .day .dm{font-size:11.5px;text-transform:uppercase;color:var(--muted)}
  .row.rush .day{background:#fde8e3}
  .row.rush .day .dn{color:#b4432c}
  .row .txt{flex:1;min-width:0}
  .row .t1{font-weight:650}
  .row .t2{font-size:14px;color:var(--muted);margin-top:2px}
  .tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .tag.rush{background:#fde8e3;color:#b4432c}
  .tag.calm{background:#e2f3ec;color:var(--ok)}
  .tag.now{background:#fff4d6;color:#8a6410}
  .cal{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .cal + .cal{margin-top:10px}
  .cal h3{margin:0 0 10px;font-size:15px;text-transform:capitalize}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .grid .h{font-size:11px;text-align:center;color:var(--muted);font-weight:700;text-transform:uppercase}
  .grid .c{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;position:relative}
  .c.past{color:#c3c9cb}
  .c.occ{background:#d7ebef;color:var(--sea)}
  .c.clean{background:var(--coral);color:#fff}
  .c.clean.calmc{background:var(--ok)}
  .c.today{outline:2px solid var(--ink);outline-offset:-2px}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:12px 4px 0}

  .sheet{background:#fff;width:100%;max-width:440px;border-radius:22px;padding:22px 20px calc(18px + env(safe-area-inset-bottom));box-shadow:0 20px 50px rgba(0,0,0,.25);animation:up .28s ease-out;max-height:88vh;overflow:auto}

  .sheet h2{margin:0 0 4px;font-size:21px;color:var(--ink);text-transform:none;letter-spacing:0}
  .sheet .sub{color:var(--muted);font-size:15px;margin-bottom:14px}
  .nr{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .nr .lab{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sea-2)}

  .nr .dates{font-size:17px;font-weight:700;margin:3px 0 2px}
  .nr.cx .dates{text-decoration:line-through;color:var(--muted)}

  .sheet{position:relative}
  .acts{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:#fff;margin:0 -20px;padding:8px 20px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -10px 16px -10px rgba(0,0,0,.12)}
  .xclose{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:#f1efe9;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
  .agenda{margin-top:12px}
  .agenda .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1.5px solid var(--sea);color:var(--sea);background:#fff;border-radius:12px;padding:11px 12px;font:650 14.5px/1.2 inherit;cursor:pointer}

  .kit li{font-size:14.5px;display:flex;align-items:center;gap:7px}
  .kit li i{font-style:normal;font-size:18px;width:22px;text-align:center}
  .kitmini{font-size:13.5px;color:#8a6410;margin-top:4px}
  .stock ul{list-style:none;margin:10px 0 0;padding:0}
  .stock li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
  .stock li:last-child{border:0}
  .stock li b{font-variant-numeric:tabular-nums}
  .tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;max-width:560px;margin:-44px auto 0;padding:8px 16px;}
  .tabs button{flex:1;border:0;border-radius:12px;padding:12px 4px;font:700 14.5px/1 inherit;white-space:nowrap;background:rgba(255,255,255,.75);color:var(--sea);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer}
  .tabs button.on{background:var(--sea);color:#fff}
  .tabs .badge{display:inline-block;min-width:18px;padding:2px 5px;border-radius:999px;background:var(--coral);color:#fff;font-size:11px;margin-left:6px;vertical-align:1px}
  main.tabbed{margin-top:8px}
  .hidden{display:none!important}
  .stp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .stp:last-child{border:0}
  .stp .lb{display:flex;align-items:center;gap:8px;font-size:15px;min-width:0}
  .stp .lb i{font-style:normal;font-size:20px;width:24px;text-align:center}
  .stp .lb small{display:block;color:var(--muted);font-size:12.5px}
  .ctr{display:flex;align-items:center;gap:4px;flex:none}
  .ctr button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:700 19px/1 inherit;color:var(--sea);cursor:pointer}
  .ctr button:active{background:var(--sand)}
  .ctr output{min-width:34px;text-align:center;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
  .low output{color:#b4432c}
  .shop li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
  .shop li:last-child{border:0}
  .shop ul{list-style:none;margin:6px 0 0;padding:0}
  .qty{font-weight:800;background:#fde8e3;color:#b4432c;border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
  .okmsg{color:var(--ok);font-weight:650;padding:8px 0}
  .note{font-size:13.5px;color:var(--muted);margin-top:6px}
  .sumline{display:flex;justify-content:space-between;font-size:15px;padding:6px 0}
  .sumline b{font-variant-numeric:tabular-nums}
  .big{font-size:22px;font-weight:800;color:var(--ok)}
  .sec{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sea-2);margin:16px 0 4px}
  .hist li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .hist ul{list-style:none;margin:0;padding:0}
  details.cfg summary{cursor:pointer;font-weight:700;color:var(--sea);padding:4px 0}
  .dem{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .dl{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;font-weight:600;padding:8px 10px;border-radius:10px;background:#eef4ff;color:#2b4c8c}
  .dl.tardif{background:#fdeee0;color:#9a4d12}
  .dl.anticipee{background:#fde8e3;color:#b4432c}
  .dl i{font-style:normal}
  .row .dem{margin-top:6px}.row .dl{font-size:13px;padding:5px 8px}
  .c.dmk::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:#2b4c8c}
  .skel{height:120px;border-radius:18px;background:linear-gradient(90deg,#fff 0,#f3efe8 50%,#fff 100%);background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#13697a"/><path d="M14 42 L32 16 L50 42 Z" fill="#f4c95d"/><path d="M10 48 q6 -5 12 0 t12 0 t12 0 t12 0" stroke="#fff" stroke-width="3" fill="none"/></svg>
    <div>
      <h1>Planning ménage</h1>
      <p>Studio Les Incas · La Grande Motte</p>
    </div>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button id="tPlan" class="on" role="tab" onclick="showTab('plan')">📅 Planning</button>
  <button id="tStock" role="tab" onclick="showTab('stock')">📦 Stock<span class="badge hidden" id="stockBadge"></span></button>
  <button id="tLinge" role="tab" onclick="showTab('linge')">🛏️ Linge<span class="badge hidden" id="lingeBadge"></span></button>
</nav>
<main id="app" class="tabbed"><div class="skel"></div></main>
<main id="stock" class="tabbed hidden"></main>
<main id="linge" class="tabbed hidden"></main>
<footer id="foot"></footer>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="sheet" id="sheet"></div></div>

<script>
const TZ = "Europe/Paris", CHECKIN = "16h";
const DATA_URL = "data/menage.json";

const todayIso = () => new Date().toLocaleDateString("sv-SE", { timeZone: TZ });
const d = iso => new Date(iso + "T12:00:00");
const diffDays = (a, b) => Math.round((d(b) - d(a)) / 864e5);
const fmt = (iso, o) => d(iso).toLocaleDateString("fr-FR", o);
const longDate = iso => fmt(iso, { weekday: "long", day: "numeric", month: "long" });
const plural = (n, w) => n + " " + w + (n > 1 ? "s" : "");
function rel(iso, today) {
  const n = diffDays(today, iso);
  if (n === 0) return "Aujourd’hui";
  if (n === 1) return "Demain";
  if (n < 7) return fmt(iso, { weekday: "long" }).replace(/^./, c => c.toUpperCase());
  return "Dans " + n + " jours";
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function cleanings(stays, today) {
  return stays.filter(s => s.depart >= today).map(s => {
    const next = stays.find(n => n.arrivee >= s.depart);
    const gap = next ? diffDays(s.depart, next.arrivee) : null;
    return { date: s.depart, stay: s, next, gap };
  });
}
function gapPill(c) {
  if (!c.next) return `<span class="pill none">Pas d’arrivée prévue pour l’instant</span>`;
  if (c.gap === 0) return `<span class="pill rush">⏱ Enchaînement le jour même · prêt pour ${arrHeure(c.next)}</span>`;
  return `<span class="pill calm">✓ ${plural(c.gap, "jour")} avant la prochaine arrivée</span>`;
}
function gapTag(c) {
  if (!c.next) return "";
  if (c.gap === 0) return `<span class="tag rush">Même jour</span>`;
  return `<span class="tag calm">+${c.gap} j</span>`;
}


// ── Demandes voyageurs (Google Sheet de Florian) ──
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/1yAR3ifZcAqqP0BBP0jMvT9ny2COKeOmRHIxKUhGb9eE/gviz/tq?tqx=out:csv&sheet=Demandes";
let DEM = [];
const DEM_INFO = {
  tardif: { e: "🕐", lab: "Départ tardif" },
  anticipee: { e: "⏩", lab: "Arrivée anticipée" },
  bagages: { e: "🧳", lab: "Dépose bagages" },
};
function parseCsv(txt) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) { if (c === '"') { if (txt[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && txt[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function normDem(rows) {
  const out = [];
  rows.slice(1).forEach(r => {
    let [dt, ty, hr, note] = r.map(x => (x || "").trim());
    let m = dt.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/), iso = null;
    if (m) iso = `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    else if ((m = dt.match(/^(\d{4})-(\d{2})-(\d{2})/))) iso = m[0];
    const t = /tard/i.test(ty) ? "tardif" : /anticip/i.test(ty) ? "anticipee" : /bagage/i.test(ty) ? "bagages" : null;
    if (!iso || !t) return;
    const hm = hr.match(/(\d{1,2})\s*[h:]\s*(\d{2})?/i);
    const heure = hm ? `${+hm[1]}h${hm[2] && hm[2] !== "00" ? hm[2] : ""}` : "";
    out.push({ date: iso, type: t, heure, note: note || "" });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
const demOn = (date, type) => DEM.find(x => x.date === date && x.type === type);
const arrHeure = s => { const a = s && demOn(s.arrivee, "anticipee"); return a && a.heure ? a.heure : CHECKIN; };
const demKey = x => `d|${x.date}|${x.type}|${x.heure}`;
function demText(x, short) {
  const h = x.heure;
  const t = x.type === "tardif" ? (h ? `Départ tardif : voyageurs présents jusqu’à ${h}` : "Départ tardif accordé")
    : x.type === "anticipee" ? (h ? `Arrivée anticipée : studio prêt pour ${h}` : "Arrivée anticipée")
    : (h ? `Dépose bagages à ${h}` : "Dépose bagages");
  return short ? t : t + (x.note ? ` · ${x.note}` : "");
}
function demLines(list) {
  const l = list.filter(Boolean);
  return l.length ? `<div class="dem">${l.map(x => `<div class="dl ${x.type}"><i>${DEM_INFO[x.type].e}</i><span>${esc(demText(x))}</span></div>`).join("")}</div>` : "";
}
const demForMenage = c => [demOn(c.date, "tardif"), c.next && demOn(c.next.arrivee, "anticipee"), c.next && demOn(c.next.arrivee, "bagages")];
const demForStay = s => [demOn(s.arrivee, "anticipee"), demOn(s.arrivee, "bagages"), demOn(s.depart, "tardif")];

function calendar(stays, cl, today, monthOffset) {
  const t = d(today), first = new Date(t.getFullYear(), t.getMonth() + monthOffset, 1, 12);
  const y = first.getFullYear(), m = first.getMonth(), nDays = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const cleanMap = new Map(cl.map(c => [c.date, c]));
  const iso = day => `${y}-${String(m + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
  let html = `<div class="cal"><h3>${first.toLocaleDateString("fr-FR", { month: "long", year: "numeric" })}</h3><div class="grid">`;
  html += ["L", "M", "M", "J", "V", "S", "D"].map(h => `<div class="h">${h}</div>`).join("");
  html += "<div></div>".repeat(lead);
  for (let day = 1; day <= nDays; day++) {
    const k = iso(day), cls = ["c"];
    const c = cleanMap.get(k);
    if (k < today) cls.push("past");
    else if (c) { cls.push("clean"); if (c.gap !== 0) cls.push("calmc"); }
    else if (stays.some(s => k >= s.arrivee && k < s.depart)) cls.push("occ");

  const e = t => t.replace(/\\/g, "\\\\").replace(/,/g, "\\,").replace(/;/g, "\;").replace(/\n/g, "\\n");
  const next = STAYS.find(n => n.arrivee >= s.depart && n !== s), same = next && next.arrivee === s.depart;
  const desc = `Départ des voyageurs après ${plural(s.nuits, "nuit")}.\n` +

      ST.hist.slice(-8).reverse().map(x => `<li><span>Séjour parti le ${fmt(x.date, { day: "numeric", month: "short" })}</span><b>${euro(x.recette)}</b></li>`).join("") + `</ul>`
    : `<div class="note">Les ventes apparaîtront ici après le premier ménage validé.</div>`) +
    `<div class="btns" style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="envoiPopup(false)">↗ Envoyer le point à Florian</button></div></section>`;

  // 5. Réglages
  h += `<h2>Réglages</h2><section class="card"><details class="cfg"><summary>Quantité à laisser dans l’épicerie</summary>` +
    PROD.map(p => `<div class="stp"><div class="lb"><i>${p.e}</i>${p.n}</div>${ctr("cible", p.id, ST.cible[p.id])}</div>`).join("") +
    `</details><details class="cfg" style="margin-top:8px"><summary>Contenu actuel de l’épicerie</summary>` +
    PROD.map(p => `<div class="stp"><div class="lb"><i>${p.e}</i>${p.n}</div>${ctr("epicerie", p.id, ST.epicerie[p.id])}</div>`).join("") +
    `<div class="note">Sert de point de départ pour calculer les ventes au prochain ménage.</div></details>
    <div class="note" style="margin-top:12px">Le stock est enregistré sur ce téléphone.</div></section>`;
  el.innerHTML = h;
}
function validerMenage() {
  const m = nextMenage(); if (!m) return;
  const rest = ST.restant || { ...ST.epicerie }, pan = m.next ? kitFor(m.next.nuits) : {};
  let recette = 0; const vend = zero(), sortie = zero();
  PROD.forEach(p => {
    vend[p.id] = Math.max(0, ST.epicerie[p.id] - rest[p.id]); recette += vend[p.id] * PRIX[p.id];
    const reas = Math.max(0, ST.cible[p.id] - rest[p.id]);
    sortie[p.id] = reas + (pan[p.id] || 0);
    ST.reserve[p.id] = Math.max(0, ST.reserve[p.id] - reas - (pan[p.id] || 0));
    ST.epicerie[p.id] = rest[p.id] + reas;
  });
  let lingeManque = [];
  LINGE.forEach(x => { const Lg = ST.linge; Lg.lavage[x.id] += Lg.place[x.id]; const take = Math.min(Lg.par[x.id], Lg.propre[x.id]);
    Lg.propre[x.id] -= take; Lg.place[x.id] = take; if (take < Lg.par[x.id]) lingeManque.push(x.n.toLowerCase()); });
  ST.faits[keyOf(m.stay)] = { date: m.date, panierPour: m.next ? keyOf(m.next) : null };
  ST.hist.push({ date: m.date, recette, vend, sortie, panier: m.next ? m.next.nuits : 0, lingeManque });
  ST.restant = null; saveSt(ST); renderStock(); renderLinge(); scrollTo(0, 0);
  envoiPopup(true);
}
function coursesFaites() {
  const { ach } = besoins(); PROD.forEach(p => ST.reserve[p.id] += ach[p.id]);
  saveSt(ST); renderStock(); toast("Réserve mise à jour");
}
async function partager(kind) {
  const { ach } = besoins(); let t;
  if (kind === "courses") t = "Courses studio La Grande Motte :\n" + PROD.filter(p => ach[p.id]).map(p => `- ${p.n} : ${ach[p.id]}`).join("\n");
  else {
    const tot = ST.hist.reduce((a, x) => a + x.recette, 0), last = ST.hist[ST.hist.length - 1];
    t = `Point stock studio La Grande Motte (${fmt(PLAN.today, { day: "numeric", month: "long" })})\n` +
      (last ? `Dernier ménage (${fmt(last.date, { day: "numeric", month: "long" })}) : recette épicerie ${euro(last.recette)}\n` : "") +
      `Recette épicerie totale : ${euro(tot)}\n\nRéserve :\n` + PROD.map(p => `- ${p.n} : ${ST.reserve[p.id]}`).join("\n") +
      (PROD.some(p => ach[p.id]) ? "\n\nÀ acheter :\n" + PROD.filter(p => ach[p.id]).map(p => `- ${p.n} : ${ach[p.id]}`).join("\n") : "\n\nRien à acheter.");
  }
  try { if (navigator.share) { await navigator.share({ text: t }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(t); toast("Texte copié, collez-le dans un message"); } catch { prompt("Copiez ce texte :", t); }
}

// ── Envoi du point à Florian (WhatsApp / e-mail) ──
const FLO_WA = "33695596436", FLO_MAIL = "dsn.florian@gmail.com";
function pointTexte() {
  const { ach } = besoins(), last = ST.hist[ST.hist.length - 1], tot = ST.hist.reduce((a, x) => a + x.recette, 0);
  const L = [`Point stock · studio La Grande Motte · ${fmt(PLAN.today, { weekday: "long", day: "numeric", month: "long" })}`, ""];
  if (last) {
    L.push(`Ménage du ${fmt(last.date, { day: "numeric", month: "long" })} : fait ✓`);
    const v = PROD.filter(p => last.vend && last.vend[p.id]);
    L.push(v.length ? "Vendu à l'épicerie : " + v.map(p => `${last.vend[p.id]} ${last.vend[p.id] === 1 ? p.n1 : p.n.toLowerCase()}`).join(", ") : "Rien vendu à l'épicerie");
    L.push(`Recette : ${euro(last.recette)}`);
    if (last.panier) L.push(`Panier d'accueil préparé (${plural(last.panier, "nuit")})`);
    L.push("");
  }
  L.push(`Recette épicerie totale : ${euro(tot)}`, "", "Réserve :", ...PROD.map(p => `- ${p.n} : ${ST.reserve[p.id]}`), "");
  const a = PROD.filter(p => ach[p.id]);
  L.push(a.length ? "À acheter :" : "Rien à acheter pour les 30 prochains jours.", ...a.map(p => `- ${p.n} : ${ach[p.id]}`));
  L.push("", `Linge : ${plural(lingeJeux(), "jeu")} propre${lingeJeux() > 1 ? "s" : ""} d'avance, ${lingeLavage()} pièce${lingeLavage() > 1 ? "s" : ""} au lavage`);
  if (last && last.lingeManque && last.lingeManque.length) L.push(`⚠ Linge manquant au dernier ménage : ${last.lingeManque.join(", ")}`);
  L.push("", "— Jérôme");
  return L.join("\n");
}
function envoiPopup(apresMenage) {
  const t = pointTexte(), last = ST.hist[ST.hist.length - 1];
  const wa = `https://wa.me/${FLO_WA}?text=${encodeURIComponent(t)}`;
  const mail = `mailto:${FLO_MAIL}?subject=${encodeURIComponent("Point stock La Grande Motte · " + fmt(PLAN.today, { day: "numeric", month: "long" }))}&body=${encodeURIComponent(t)}`;
  document.getElementById("sheet").innerHTML = `<button class="xclose" onclick="closeModal()" aria-label="Fermer">×</button>
    <div class="bell" style="animation:none;background:#e2f3ec">${apresMenage ? "✅" : "📨"}</div>
    <h2 id="mTitle">${apresMenage ? "Ménage validé" : "Envoyer le point à Florian"}</h2>
    <div class="sub">${apresMenage && last ? `Recette épicerie : <b style="color:var(--ok)">${euro(last.recette)}</b>. ` : ""}Envoyez le point à Florian en un appui.</div>
    <pre style="white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.45;background:var(--sand);border-radius:12px;padding:12px;margin:0 0 12px;max-height:38vh;overflow:auto">${esc(t)}</pre>
    <div class="acts">
      <a class="ack" style="background:#25d366;text-align:center;text-decoration:none" href="${wa}" target="_blank" rel="noopener" onclick="setTimeout(closeModal,400)">💬 Envoyer par WhatsApp</a>
      <a class="ack" style="background:#fff;color:var(--sea);border:1.5px solid var(--sea);text-align:center;text-decoration:none" href="${mail}" onclick="setTimeout(closeModal,400)">✉️ Envoyer par e-mail</a>
      <button class="later" onclick="closeModal()">Plus tard</button>
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}

// ══ Onglet Linge ══
const lingeJeux = () => Math.min(...LINGE.map(x => ST.linge.par[x.id] ? Math.floor(ST.linge.propre[x.id] / ST.linge.par[x.id]) : 99));
const lingeLavage = () => LINGE.reduce((a, x) => a + ST.linge.lavage[x.id], 0);
function renderLinge() {
  const el = document.getElementById("linge"); if (!el) return;
  const Lg = ST.linge, jeux = lingeJeux(), lav = lingeLavage(), { today, stays } = PLAN;
  const lim7 = new Date(Date.parse(today) + 7 * 864e5).toISOString().slice(0, 10);
  const prochains = cleanings(stays, today).filter(c => c.date <= lim7 && !ST.faits[keyOf(c.stay)]);
  const besoin = Math.max(1, prochains.length);
  const badge = document.getElementById("lingeBadge");
  badge.textContent = "!"; badge.classList.toggle("hidden", jeux >= besoin);
  const col = jeux >= besoin + 1 ? "var(--ok)" : jeux >= besoin ? "#c08a12" : "#b4432c";
  const vide = LINGE.every(x => !Lg.propre[x.id] && !Lg.lavage[x.id]);
  let h = `<section class="card">
    <div style="font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sea-2)">Linge propre d’avance</div>
    <div style="display:flex;align-items:baseline;gap:10px;margin:6px 0 2px"><span style="font-size:40px;font-weight:800;color:${col};line-height:1">${jeux >= 99 ? "–" : jeux}</span><span style="font-size:17px;color:var(--muted)">jeu${jeux > 1 ? "x" : ""} complet${jeux > 1 ? "s" : ""} pour 2 personnes</span></div>
    <div class="note">${prochains.length ? `${plural(prochains.length, "ménage")} dans les 7 prochains jours : ${prochains.map(c => fmt(c.date, { weekday: "short", day: "numeric" }).replace(".", "")).join(", ")}.` : "Aucun ménage dans les 7 prochains jours."}
      ${jeux < besoin ? `<br><b style="color:#b4432c">⚠ Pas assez de linge propre : récupérez ou lavez ${lav ? `les ${lav} pièces au lavage` : "du linge"} avant le prochain ménage.</b>` : ""}</div>
    ${lav ? `<button class="ack" onclick="retourLaverie()">🧺 Lavage terminé : ${lav} pièce${lav > 1 ? "s" : ""} propre${lav > 1 ? "s" : ""}</button>` : ""}
  </section>`;
  if (vide) h += `<section class="card" style="margin-top:10px;background:#fff8e8;border:1.5px solid #f6e3b4"><b>Premier inventaire</b><div class="note">Comptez le linge propre que vous avez en réserve et saisissez-le ci-dessous. Le jeu actuellement dans l’appartement est déjà compté.</div></section>`;
  h += `<h2>Linge propre en réserve</h2><section class="card">` + LINGE.map(x => {
    const low = Lg.propre[x.id] < Lg.par[x.id] * besoin;
    return `<div class="stp"><div class="lb"><i>${x.e}</i><div>${x.n}<small>${Lg.par[x.id]} par séjour · ${Lg.place[x.id]} en place${Lg.lavage[x.id] ? ` · ${Lg.lavage[x.id]} au lavage` : ""}</small></div></div>${ctr("linge.propre", x.id, Lg.propre[x.id], low ? "low" : "")}</div>`; }).join("") +
    `<div class="note">À chaque ménage validé, le jeu en place passe au lavage et un jeu propre le remplace. Retirez ici une pièce abîmée, ajoutez-en une neuve.</div></section>`;
  h += `<h2>Au lavage</h2><section class="card">` + LINGE.map(x => `<div class="stp"><div class="lb"><i>${x.e}</i>${x.n}</div>${ctr("linge.lavage", x.id, Lg.lavage[x.id])}</div>`).join("") +
    `<div class="note">Si une partie seulement est revenue propre, baissez ici et augmentez la réserve propre.</div></section>`;
  h += `<h2>Réglages linge</h2><section class="card"><details class="cfg"><summary>Quantité par séjour (2 personnes)</summary>` +
    LINGE.map(x => `<div class="stp"><div class="lb"><i>${x.e}</i>${x.n}</div>${ctr("linge.par", x.id, Lg.par[x.id])}</div>`).join("") +
    `</details><details class="cfg" style="margin-top:8px"><summary>Linge actuellement en place dans le studio</summary>` +
    LINGE.map(x => `<div class="stp"><div class="lb"><i>${x.e}</i>${x.n}</div>${ctr("linge.place", x.id, Lg.place[x.id])}</div>`).join("") +
    `</details><div class="btns" style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="envoiPopup(false)">↗ Envoyer le point à Florian</button></div></section>`;
  el.innerHTML = h;
}
function retourLaverie() {
  LINGE.forEach(x => { ST.linge.propre[x.id] += ST.linge.lavage[x.id]; ST.linge.lavage[x.id] = 0; });
  saveSt(ST); renderLinge(); renderStock(); toast("Linge rangé dans la réserve propre");
}

function render(data) {
  const today = todayIso(), stays = (data.sejours || []).slice().sort((a, b) => a.arrivee.localeCompare(b.arrivee));
  STAYS = stays;
  const cl = cleanings(stays, today), app = document.getElementById("app");
  const current = stays.find(s => s.arrivee <= today && s.depart > today);
  let html = "";

  if (!cl.length) {
    html += `<section class="card hero"><div class="kicker">Prochain ménage</div><div class="empty">Aucun ménage prévu pour le moment.<br>La page se met à jour automatiquement dès qu’une réservation arrive.</div></section>`;
  } else {
    const c = cl[0];
    html += `<section class="card hero">
      <div class="kicker">Prochain ménage</div>
      <div class="when"><span class="rel">${rel(c.date, today)}</span><span class="date">${longDate(c.date)}</span></div>
      <div>Départ des voyageurs après ${plural(c.stay.nuits, "nuit")}${current && current === c.stay ? " · <b>séjour en cours</b>" : ""}</div>
      ${gapPill(c)}
      ${demLines(demForMenage(c))}
      <div class="next">${c.next ? `Arrivée suivante : <b>${longDate(c.next.arrivee)}</b> à partir de ${arrHeure(c.next)} · ${plural(c.next.nuits, "nuit")}` : "Le studio reste libre après ce ménage."}</div>
      ${c.next ? kitBlock(c.next, "Panier d’accueil à préparer") : ""}
    </section>`;
  }

  html += agendaBlock();

  if (cl.length > 1) {
    html += `<h2>Ménages à venir</h2><div class="list">` + cl.slice(1).map(c => `
      <div class="row ${c.gap === 0 ? "rush" : ""}">
        <div class="day"><div class="dw">${fmt(c.date, { weekday: "short" }).replace(".", "")}</div><div class="dn">${fmt(c.date, { day: "numeric" })}</div><div class="dm">${fmt(c.date, { month: "short" }).replace(".", "")}</div></div>
        <div class="txt"><div class="t1">Ménage · ${rel(c.date, today).toLowerCase()}</div>
          <div class="t2">${c.next ? (c.gap === 0 ? `Nouveaux voyageurs le jour même à ${arrHeure(c.next)}` : `Prochaine arrivée ${fmt(c.next.arrivee, { weekday: "long", day: "numeric", month: "long" })}`) : "Pas d’arrivée prévue après"}</div>${c.next ? `<div class="kitmini">🎁 Panier ${kitTier(c.next.nuits)} : ${kitText(c.next.nuits)}</div>` : ""}${demLines(demForMenage(c))}</div>
        ${gapTag(c)}
      </div>`).join("") + `</div>`;
  }

  const upcoming = stays.filter(s => s.depart > today);
  if (upcoming.length) {
    html += `<h2>Réservations</h2><div class="list">` + upcoming.map(s => {
      const now = s.arrivee <= today;
      return `<div class="row">
        <div class="day"><div class="dw">${fmt(s.arrivee, { weekday: "short" }).replace(".", "")}</div><div class="dn">${fmt(s.arrivee, { day: "numeric" })}</div><div class="dm">${fmt(s.arrivee, { month: "short" }).replace(".", "")}</div></div>
        <div class="txt"><div class="t1">${fmt(s.arrivee, { day: "numeric", month: "short" })} → ${fmt(s.depart, { day: "numeric", month: "short" })}${now ? ` <span class="tag now">En cours</span>` : ""}</div>
          <div class="t2">${plural(s.nuits, "nuit")} · arrivée ${arrHeure(s)}</div><div class="kitmini">🎁 ${kitText(s.nuits)}</div>${demLines(demForStay(s))}</div>
        <button class="cal-add" data-cal="${keyOf(s)}" aria-label="Ajouter ce ménage à mon agenda" title="Ajouter à mon agenda">📅</button>
      </div>`;
    }).join("") + `</div>`;
  }

  html += stockBlock(stays, today);
  html += `<h2>Calendrier</h2>` + calendar(stays, cl, today, 0) + calendar(stays, cl, today, 1) +
    `<div class="legend"><span><i style="background:#d7ebef"></i>Occupé</span><span><i style="background:var(--coral)"></i>Ménage, arrivée le jour même</span><span><i style="background:var(--ok)"></i>Ménage, sans arrivée le jour même</span><span><i style="background:#2b4c8c;border-radius:50%;width:8px;height:8px"></i>Demande voyageur</span></div>`;
  app.innerHTML = html;
  PLAN = { stays, today };
  renderStock(); renderLinge();
  checkNew(stays, today);

  const ago = Date.now() - Date.parse(data.verifie), stale = ago > 8 * 3600e3;
  const when = new Date(data.verifie).toLocaleString("fr-FR", { timeZone: TZ, weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  document.getElementById("foot").innerHTML =
    `<span class="dot ${stale ? "stale" : ""}"></span>Synchronisé avec Airbnb · dernière vérification ${esc(when)}${stale ? "<br>La synchronisation semble en retard, prévenir Florian." : ""}`;
}

async function load() {
  try {
    const [r, csv] = await Promise.all([
      fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" }),
      fetch(SHEET_CSV + "&t=" + Date.now(), { cache: "no-store" }).then(x => x.ok ? x.text() : null).catch(() => null),
    ]);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    DEM = csv && csv.startsWith('"Date"') ? normDem(parseCsv(csv)) : (data.demandes || DEM);
    render(data);
  } catch (e) {
    if (!document.querySelector(".hero"))
      document.getElementById("app").innerHTML = `<section class="card"><div class="empty">Planning en cours de préparation.<br>Réessayez dans quelques minutes.</div></section>`;
  }
}
if (location.hash === "#stock") showTab("stock");
if (location.hash === "#linge") showTab("linge");
load();
setInterval(load, 10 * 60e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {});
</script>
